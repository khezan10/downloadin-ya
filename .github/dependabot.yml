version: 2
updates:
  # Dependencies only — a major bump can change the framework's conventions,
  # so those are done by hand.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: Asia/Jakarta
    open-pull-requests-limit: 5
    labels: [dependencies]
    groups:
      minor-and-patch:
        applies-to: version-updates
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: Asia/Jakarta
    open-pull-requests-limit: 3
    labels: [dependencies, ci]
