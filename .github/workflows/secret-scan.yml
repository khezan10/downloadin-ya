name: Secret scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  scan:
    name: Fail if a credential reaches the repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Look for connection strings and tokens
        shell: bash
        run: |
          set -uo pipefail
          found=0

          # Every MongoDB connection string in the repository has to use the
          # *** placeholder. Anything else is a real credential. (Matching on
          # the password shape instead would trip over the placeholder, and a
          # check that cannot tell them apart is worse than no check at all.)
          bad=$(git grep -I -n 'mongodb+srv://' -- . | grep -vE '\*\*\*|<user|username' || true)
          if [ -n "$bad" ]; then
            echo "::error::A MongoDB connection string without the *** placeholder is in the repository."
            echo "$bad"
            found=1
          fi

          if git grep -I -n -E 'gh[pousr]_[A-Za-z0-9]{20,}' -- . ; then
            echo "::error::A GitHub token is in the repository."
            found=1
          fi

          if git grep -I -n -E 'vcp_[A-Za-z0-9]{20,}' -- . ; then
            echo "::error::A Vercel token is in the repository."
            found=1
          fi

          if git ls-files --error-unmatch .env.local .env.local.new 2>/dev/null; then
            echo "::error::An environment file with secrets is tracked in git."
            found=1
          fi

          exit $found
