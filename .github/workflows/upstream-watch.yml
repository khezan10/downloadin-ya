name: Upstream watch

# The site resolves downloads through three free third-party APIs. They go down
# without warning, and a dead upstream means a dead download. This watch runs
# every six hours against the deployed site and opens (or updates) a single
# tracking issue when one of them stops answering.

on:
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: upstream-watch
  cancel-in-progress: true

env:
  SITE_URL: https://downloadin.mzg.my.id

jobs:
  watch:
    name: Probe the deployed site and its upstreams
    runs-on: ubuntu-latest
    steps:
      - name: Check the site itself
        id: site
        run: |
          code=$(curl -s -o /tmp/health.json -w '%{http_code}' --max-time 30 \
            "${SITE_URL}/api/health" || true)
          echo "http=$code" >> "$GITHUB_OUTPUT"
          echo "body=$(cat /tmp/health.json)" >> "$GITHUB_OUTPUT"
          if [ "$code" != "200" ]; then
            echo "The site answered $code instead of 200."
            exit 1
          fi
          status=$(jq -r '.status' /tmp/health.json 2>/dev/null || echo unknown)
          if [ "$status" != "ok" ]; then
            echo "The site reports status=$status."
            exit 1
          fi

      - name: Check every upstream resolver
        id: upstreams
        run: |
          code=$(curl -s -o /tmp/upstream.json -w '%{http_code}' --max-time 45 \
            "${SITE_URL}/api/upstream-health" || true)
          if [ "$code" != "200" ]; then
            echo "The upstream panel answered $code instead of 200."
            exit 1
          fi
          jq -r '.upstreams[] | "\(.id)\t\(.label)\t\(.status)\t\(.ms // "unknown")"' \
            /tmp/upstream.json > /tmp/upstream.lines
          cat /tmp/upstream.lines
          {
            echo 'upstreams<<EOF'
            cat /tmp/upstream.lines
            echo EOF
            echo "healthy=$(jq -r '.healthy' /tmp/upstream.json)"
            echo "total=$(jq -r '.total' /tmp/upstream.json)"
          } >> "$GITHUB_OUTPUT"
          healthy=$(jq -r '.healthy' /tmp/upstream.json)
          total=$(jq -r '.total' /tmp/upstream.json)
          if [ "$healthy" != "$total" ]; then
            echo "$healthy of $total upstreams are answering."
            exit 1
          fi

      - name: Record the result
        if: always()
        env:
          UPSTREAM_LINES: ${{ steps.upstreams.outputs.upstreams }}
          SITE_LINES: ${{ steps.site.outputs.body }}
          HEALTHY: ${{ steps.upstreams.outputs.healthy }}
          TOTAL: ${{ steps.upstreams.outputs.total }}
        run: |
          {
            echo "### Upstream watch — $(date -u '+%Y-%m-%d %H:%M UTC')"
            echo
            echo "Site health: \`${SITE_LINES}\`"
            echo
            echo "Upstreams answering: **${HEALTHY} of ${TOTAL}**"
            echo
            echo "| Upstream | Label | Status | Latency |"
            echo "| --- | --- | --- | --- |"
            echo "$UPSTREAM_LINES" | while IFS=$'\t' read -r id label status ms; do
              [ -z "$id" ] && continue
              echo "| $id | $label | $status | ${ms} ms |"
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Open or update the tracking issue
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const summary = `${{ steps.upstreams.outputs.upstreams }}`
            const body = [
              'One or more upstream resolvers stopped answering.',
              '',
              '```',
              summary || '(no upstream data)',
              '```',
              '',
              `_Checked at ${new Date().toISOString()}._`,
              '',
              'This issue updates itself on every failed run, and is closed',
              'once every upstream answers again.',
            ].join('\n');

            const title = 'Upstream resolver is not answering';
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100,
            });
            const existing = issues.data.find((i) => i.title === title);

            if (existing) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
              });
            }

      - name: Close the tracking issue once every upstream answers again
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const title = 'Upstream resolver is not answering';
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100,
            });
            const existing = issues.data.find((i) => i.title === title);
            if (existing) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                state: 'closed',
                body: `${existing.body || ''}\n\n_Closed at ${new Date().toISOString()} — every upstream is answering again._`,
              });
            }
